<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request submitted</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; }
  .card { max-width: 480px; margin: 80px auto 0; background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; }
  h1 { font-size: 20px; color: #1a1a1a; margin-bottom: 8px; }
  p { color: #555; font-size: 14px; }
  .ref { font-family: monospace; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
  a { display: inline-block; margin-top: 20px; color: #1d6f56; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Request submitted</h1>
    <p>We'll start matching you with verified subcontractors in your area.</p>
    {% if request_id %}
    <p>Reference: <span class="ref">{{ request_id[:8] }}</span></p>
    {% endif %}
    <a href="/">Submit another request</a>
  </div>
</body>
</html>
