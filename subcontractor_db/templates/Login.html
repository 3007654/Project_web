{% extends "base.html" %}
{% block title %}Verifier Login{% endblock %}
{% block content %}
  <h1>Verifier Login</h1>
  <p class="meta">Only authorised verifiers can log in here. Accounts are created via the
    create_verifier.py command-line tool, not through this page.</p>

  {% if error %}
    <div class="errors"><strong>{{ error }}</strong></div>
  {% endif %}

  <div class="card">
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>
{% endblock %}
